  <style>
    :root{
      --bg:#fff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --panel:#f8fafc;
      --a:#2563eb;       /* Série A */
      --b:#16a34a;       /* Série B */
      --c:#f59e0b;       /* Executado (sem planejado) */
      --shadow: 0 10px 30px rgba(2,6,23,.06);
      --r:16px;
      --font: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font)}
    .wrap{max-width:1150px;margin:26px auto;padding:0 18px 30px}
    header{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
    h1{margin:0;font-size:20px;letter-spacing:-.02em}
    .sub{margin:6px 0 0;color:var(--muted);font-size:13px}
    .controls{display:flex;gap:10px;flex-wrap:wrap}
    .ctl{
      border:1px solid var(--border); border-radius:12px; padding:10px 12px; background:#fff;
      box-shadow: 0 1px 0 rgba(2,6,23,.02);
      display:flex; gap:8px; align-items:center; font-size:13px;
    }
    .ctl label{color:var(--muted);font-size:12px}
    select{border:none;outline:none;font:inherit;background:transparent;cursor:pointer;max-width:420px}
    .grid{display:grid;grid-template-columns: 1fr; gap:14px}
    .card{border:1px solid var(--border);border-radius:var(--r);background:#fff;box-shadow:var(--shadow)}
    .card-h{padding:14px 16px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .card-h h2{margin:0;font-size:14px}
    .card-h p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .content{padding:10px 16px 16px}
    .chart-wrap{border:1px solid var(--border);border-radius:14px;background:linear-gradient(180deg,#fff,var(--panel));padding:12px}
    .legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:0 0 8px;align-items:center}
    .key{display:flex;gap:8px;align-items:center}
    .sw{width:14px;height:10px;border-radius:4px;background:var(--a)}
    .sw.b{background:var(--b)}
    .sw.c{background:var(--c)}
    svg{width:100%;height:auto;display:block}
    .axis text{fill:var(--muted);font-size:11px}
    .gridline{stroke:#e8eef7;stroke-width:1}
    .barA{fill:var(--a)}
    .barB{fill:var(--b)}
    .barC{fill:var(--c)}
    .sliceA{fill:var(--a)}
    .sliceB{fill:var(--b)}
    .sliceStroke{stroke:#fff;stroke-width:2}
    .tooltip{
      position:fixed; pointer-events:none; opacity:0;
      transform: translate(-50%, calc(-100% - 12px));
      background:#0b1220;color:#fff;padding:10px 12px;border-radius:12px;
      font-size:12px; box-shadow:0 16px 40px rgba(0,0,0,.22); min-width:230px;
      transition:opacity .12s ease; z-index:30;
    }
    .tooltip .t-title{font-weight:700;margin-bottom:6px}
    .tooltip .t-row{display:flex;justify-content:space-between;gap:10px;opacity:.95}
    .pill{
      display:inline-flex;align-items:center;gap:6px;border-radius:999px;
      padding:6px 10px;font-size:12px;border:1px solid var(--border);background:#fff;color:var(--muted)
    }
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:10px 12px;border-top:1px solid var(--border);text-align:left}
    th{background:var(--panel);color:var(--muted);font-weight:600}
    tbody tr:hover td{background:#fbfdff}
    .mono{font-variant-numeric:tabular-nums}
    @media (min-width: 980px){
      .grid{grid-template-columns: 1.1fr .9fr}
    }
  </style>
</head>

      <div class="controls">

          </table>
        </div>
      </aside>
    </div>
  </div>

Cancelamento de Registro de Revendas de Agrotóxicos, Prestadoras de Serviço Manipuladores de Agrotóxicos e Postos ou Centrais de Recebimento de Embalagens Vazias ou com Resíduos de Agrotóxicos – condicionada à uma Nota Técnica (REGISTRO DE ESTABELECIMENTOS):
1° semestre:
        Planejado: N/A
        Executado: 1
2° semestre:
        Planejado: N/A
        Executado: 0
`;

    // ============================
    // Utils
    // ============================
    const $ = (s) => document.querySelector(s);
    const fmt = (n) => new Intl.NumberFormat("pt-BR").format(n);
    const tooltip = $("#tooltip");

    function parseBRNumber(v){
      if (v == null) return null;
      const s0 = String(v).trim();
      if (!s0) return null;
      if (/^(N\/A|NA|n\/a)$/i.test(s0)) return null;

      // remove unidades entre parênteses do valor
      let s = s0.replace(/\(.*?\)/g, " ").trim();
      s = s.replace(/[^\d,.\-]/g, "");
      if (!s) return null;

      if (s.includes(",")){
        s = s.replace(/\./g, "").replace(",", ".");
      } else {
        s = s.replace(/\./g, "");
      }
      const n = Number(s);
      return Number.isFinite(n) ? n : null;
    }

    function splitIndicatorProgram(line, manager){
      const s = line.replace(/:\s*$/, "").trim();
      const lastOpen = s.lastIndexOf("(");
      const lastClose = s.lastIndexOf(")");

      if (lastOpen < 0 || lastClose < lastOpen){
        return { program: manager ? manager : "GERAL", indicator: s };
      }

      const program = s.slice(lastOpen + 1, lastClose).trim();
      const indicator = s.slice(0, lastOpen).trim();
      const programKey = manager ? `${manager} — ${program}` : program;
      return { program: programKey, indicator };
    }

    function parseReport(raw){
      const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

      let manager = null;
      let current = null;
      let currentSem = null;

      const out = [];

      for (const line of lines){
        const m = line.match(/^GERÊNCIA\s+DE\s+.+\(([^)]+)\)\s*$/i);
        if (m){
          manager = m[1].trim();
          current = null;
          currentSem = null;
          continue;
        }

        if (/^-{6,}$/.test(line)) continue;

        const sem = line.match(/^([12])\s*[º°]\s*semestre\s*:/i);
        if (sem){
          currentSem = sem[1] === "1" ? "1S" : "2S";
          continue;
        }

        if (/:$/.test(line) && !/^Planejado:/i.test(line) && !/^Executado:/i.test(line)){
          current = splitIndicatorProgram(line, manager);
          continue;
        }

        if (current && currentSem){
          const p = line.match(/^Planejado\s*:\s*(.+)$/i);
          if (p){
            out.push({ ...current, semestre: currentSem, planned: parseBRNumber(p[1]), executed: 0 });
            continue;
          }

          const e = line.match(/^Executado\s*:\s*(.+)$/i);
          if (e){
            const v = parseBRNumber(e[1]) ?? 0;

            // aplica no último item compatível; se não existir, cria
            let applied = false;
            for (let i = out.length - 1; i >= 0; i--){
              const it = out[i];
              if (it.program === current.program && it.indicator === current.indicator && it.semestre === currentSem){
                it.executed = v;
                applied = true;
                break;
              }
            }
            if (!applied){
              out.push({ ...current, semestre: currentSem, planned: null, executed: v });
            }
            continue;
          }
        }
      }

      // normaliza duplicatas (se seu texto repetir um item, NÃO soma — mantém o maior)
      const map = new Map();
      for (const r of out){
        const key = `${r.program}||${r.indicator}||${r.semestre}`;
        if (!map.has(key)){
          map.set(key, { ...r });
        } else {
          const prev = map.get(key);
          prev.executed = Math.max(prev.executed ?? 0, r.executed ?? 0);
          const p1 = prev.planned;
          const p2 = r.planned;
          if (p2 != null && (p1 == null || p2 > p1)) prev.planned = p2;
        }
      }
      return [...map.values()];
    }

    const DATA = parseReport(RAW_TEXT);

    // ============================
    // UI init
    // ============================
    const programSel = $("#program");
    const indicatorSel = $("#indicator");
    const tbody = $("#tbody");

    const programs = [...new Set(DATA.map(d => d.program))].sort((a,b)=>a.localeCompare(b));
    programs.forEach(p => {
      const opt = document.createElement("option");
      opt.value = p;
      opt.textContent = p;
      programSel.appendChild(opt);
    });

    programSel.addEventListener("change", () => {
      fillIndicators(programSel.value);
      render(programSel.value, indicatorSel.value);
    });
    indicatorSel.addEventListener("change", () => render(programSel.value, indicatorSel.value));

    fillIndicators(programs[0]);
    render(programs[0], indicatorSel.value);

    function fillIndicators(program){
      indicatorSel.innerHTML = "";
      const inds = [...new Set(DATA.filter(d => d.program === program).map(d => d.indicator))]
        .sort((a,b)=>a.localeCompare(b));
      inds.forEach(i => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = i;
        indicatorSel.appendChild(opt);
      });
    }

    // ============================
    // Escolha automática do melhor gráfico
    // ============================
    function chooseChartType(rows){
      const plannedVals = rows.map(r => (typeof r.planned === "number" ? r.planned : null));
      const hasPlannedPos = plannedVals.some(v => v !== null && v > 0);
      const hasPlannedZero = plannedVals.some(v => v !== null && v === 0);

      const r1 = rows.find(r => r.semestre === "1S");
      const r2 = rows.find(r => r.semestre === "2S");
      const e1 = r1?.executed ?? 0;
      const e2 = r2?.executed ?? 0;
      const execSum = (e1 ?? 0) + (e2 ?? 0);

      if (hasPlannedPos) return "BAR_COMPARE";       // planejado relevante
      if (hasPlannedZero) return "BAR_EXEC_ONLY";    // planejado = 0 -> mostra só executado
      if (execSum > 0) return "PIE_EXEC_SEMESTER";   // planejado N/A -> pizza por semestre
      return "BAR_EXEC_ONLY";
    }

    // ============================
    // Render
    // ============================
    function render(program, indicator){
      const rows = DATA
        .filter(d => d.program === program && d.indicator === indicator)
        .sort((a,b)=>a.semestre.localeCompare(b.semestre)); // 1S,2S

      $("#chartTitle").textContent = `${program} — ${indicator}`;

      // table
      tbody.innerHTML = "";
      ["1S","2S"].forEach(s => {
        const r = rows.find(x => x.semestre === s) || { planned:null, executed:0 };
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${s === "1S" ? "1º semestre" : "2º semestre"}</td>
          <td class="mono">${r.planned === null || r.planned === undefined ? "N/A" : fmt(r.planned)}</td>
          <td class="mono">${fmt(r.executed ?? 0)}</td>
        `;
        tbody.appendChild(tr);
      });

      const chartType = chooseChartType(rows);
      const legend = $("#legend");
      const svg = $("#chart");

      if (chartType === "BAR_COMPARE"){
        $("#modePill").textContent = "Modo: Barra (Planejado x Executado)";
        legend.innerHTML = `
          <div class="key"><span class="sw"></span> Planejado</div>
          <div class="key"><span class="sw b"></span> Executado</div>
        `;
        drawBarCompare(svg, rows);
        return;
      }

      if (chartType === "PIE_EXEC_SEMESTER"){
        $("#modePill").textContent = "Modo: Pizza (Executado 1º vs 2º semestre)";
        legend.innerHTML = `
          <div class="key"><span class="sw"></span> 1º semestre</div>
          <div class="key"><span class="sw b"></span> 2º semestre</div>
        `;
        drawPieSemester(svg, rows);
        return;
      }

      $("#modePill").textContent = "Modo: Barra (Executado)";
      legend.innerHTML = `<div class="key"><span class="sw c"></span> Executado</div>`;
      drawBarExecOnly(svg, rows);
    }

    // ============================
    // Barra: Planejado x Executado (2 semestres)
    // ============================
    function drawBarCompare(svg, rows){
      const W = 920, H = 360;
      const pad = { top: 18, right: 18, bottom: 54, left: 64 };
      const innerW = W - pad.left - pad.right;
      const innerH = H - pad.top - pad.bottom;

      const r1 = rows.find(r => r.semestre === "1S") || { semestre:"1S", planned:null, executed:0 };
      const r2 = rows.find(r => r.semestre === "2S") || { semestre:"2S", planned:null, executed:0 };
      const data = [r1, r2];

      const values = [];
      data.forEach(r => {
        if (typeof r.planned === "number") values.push(r.planned);
        values.push(r.executed ?? 0);
      });

      const maxV = Math.max(1, ...values);
      const yMax = Math.ceil(maxV * 1.12);

      const xGroup = (i) => pad.left + i * (innerW / 2) + 18;
      const groupW = (innerW / 2) - 36;

      const y = (v) => pad.top + (1 - (v / yMax)) * innerH;
      const h = (v) => (v / yMax) * innerH;

      const ticks = 5;
      const tickVals = Array.from({length: ticks+1}, (_,k)=> (k*yMax)/ticks);

      svg.innerHTML = "";

      tickVals.forEach(tv=>{
        const yy = y(tv);
        svg.appendChild(el("line", { x1: pad.left, y1: yy, x2: W-pad.right, y2: yy, class:"gridline" }));
        const t = el("text", { x: pad.left-10, y: yy+4, "text-anchor":"end", class:"axis" });
        t.textContent = fmt(Math.round(tv));
        svg.appendChild(t);
      });

      ["1º semestre","2º semestre"].forEach((lab,i)=>{
        const tx = el("text", { x: xGroup(i)+groupW/2, y: H-22, "text-anchor":"middle", class:"axis" });
        tx.textContent = lab;
        svg.appendChild(tx);
      });

      data.forEach((r,i)=>{
        const gx = xGroup(i);
        const barW = (groupW - 14) / 2;

        const pv = (typeof r.planned === "number" ? r.planned : 0);
        const ev = (r.executed ?? 0);

        svg.appendChild(rectWithTooltip(gx, y(pv), barW, h(pv), "barA", r, "Planejado", pv));
        svg.appendChild(rectWithTooltip(gx + barW + 14, y(ev), barW, h(ev), "barB", r, "Executado", ev));

        svg.appendChild(barLabel(gx + barW/2, y(pv)-6, pv));
        svg.appendChild(barLabel(gx + barW + 14 + barW/2, y(ev)-6, ev));
      });
    }

    // ============================
    // Barra: Executado apenas (2 semestres)
    // ============================
    function drawBarExecOnly(svg, rows){
      const W = 920, H = 360;
      const pad = { top: 18, right: 18, bottom: 54, left: 64 };
      const innerW = W - pad.left - pad.right;
      const innerH = H - pad.top - pad.bottom;

      const r1 = rows.find(r => r.semestre === "1S") || { semestre:"1S", planned:null, executed:0 };
      const r2 = rows.find(r => r.semestre === "2S") || { semestre:"2S", planned:null, executed:0 };
      const data = [r1, r2];

      const values = data.map(r => r.executed ?? 0);
      const maxV = Math.max(1, ...values);
      const yMax = Math.ceil(maxV * 1.12);

      const xGroup = (i) => pad.left + i * (innerW / 2) + 18;
      const groupW = (innerW / 2) - 36;

      const y = (v) => pad.top + (1 - (v / yMax)) * innerH;
      const h = (v) => (v / yMax) * innerH;

      const ticks = 5;
      const tickVals = Array.from({length: ticks+1}, (_,k)=> (k*yMax)/ticks);

      svg.innerHTML = "";

      tickVals.forEach(tv=>{
        const yy = y(tv);
        svg.appendChild(el("line", { x1: pad.left, y1: yy, x2: W-pad.right, y2: yy, class:"gridline" }));
        const t = el("text", { x: pad.left-10, y: yy+4, "text-anchor":"end", class:"axis" });
        t.textContent = fmt(Math.round(tv));
        svg.appendChild(t);
      });

      ["1º semestre","2º semestre"].forEach((lab,i)=>{
        const tx = el("text", { x: xGroup(i)+groupW/2, y: H-22, "text-anchor":"middle", class:"axis" });
        tx.textContent = lab;
        svg.appendChild(tx);
      });

      data.forEach((r,i)=>{
        const gx = xGroup(i);
        const ev = (r.executed ?? 0);
        const barW = groupW * 0.55;
        const bx = gx + (groupW - barW)/2;

        svg.appendChild(rectWithTooltip(bx, y(ev), barW, h(ev), "barC", r, "Executado", ev));
        svg.appendChild(barLabel(bx + barW/2, y(ev)-6, ev));
      });
    }

    // ============================
    // Pizza/Donut: Executado 1S vs 2S
    // ============================
    function drawPieSemester(svg, rows){
      const r1 = rows.find(r => r.semestre === "1S") || { semestre:"1S", planned:null, executed:0 };
      const r2 = rows.find(r => r.semestre === "2S") || { semestre:"2S", planned:null, executed:0 };

      const v1 = r1.executed ?? 0;
      const v2 = r2.executed ?? 0;
      const total = (v1 + v2) || 1;

      const cx = 460, cy = 170;
      const R  = 110;
      const rr = 62;

      svg.innerHTML = "";

      let start = -90;
      const slices = [
        { label:"1º semestre", value:v1, cls:"sliceA", row:r1 },
        { label:"2º semestre", value:v2, cls:"sliceB", row:r2 },
      ];

      slices.forEach(s=>{
        const ang = (s.value / total) * 360;
        const end = start + ang;
        const path = donutSlice(cx, cy, R, rr, start, end);
        path.setAttribute("class", `${s.cls} sliceStroke`);
        path.setAttribute("tabindex", "0");

        const percent = Math.round((s.value / total) * 100);

        const show = (clientX, clientY) => {
          tooltip.style.left = clientX + "px";
          tooltip.style.top = clientY + "px";
          tooltip.style.opacity = "1";
          tooltip.innerHTML = `
            <div class="t-title">${s.label}</div>
            <div class="t-row"><span>Executado</span><b>${fmt(s.value)} (${percent}%)</b></div>
            <div class="t-row"><span>Planejado</span><b>${(s.row.planned == null ? "N/A" : fmt(s.row.planned))}</b></div>
          `;
        };

        path.addEventListener("mousemove", (e)=>show(e.clientX, e.clientY));
        path.addEventListener("mouseleave", ()=>tooltip.style.opacity="0");
        path.addEventListener("focus", ()=>show(window.innerWidth/2, 120));
        path.addEventListener("blur", ()=>tooltip.style.opacity="0");

        svg.appendChild(path);

        if (s.value > 0){
          const mid = (start + end) / 2;
          const p = polar(cx, cy, R + 28, mid);
          const t = el("text", { x: p.x, y: p.y, "text-anchor":"middle", class:"axis" });
          t.textContent = `${percent}%`;
          svg.appendChild(t);
        }

        start = end;
      });

      svg.appendChild(el("circle", { cx, cy, r: rr, fill: "white" }));
      const t1 = el("text", { x: cx, y: cy+6, "text-anchor":"middle", class:"axis" });
      t1.textContent = fmt(v1 + v2);
      svg.appendChild(t1);
      const t2 = el("text", { x: cx, y: cy+28, "text-anchor":"middle", class:"axis" });
      t2.textContent = "Total executado";
      svg.appendChild(t2);
    }

    // ============================
    // Helpers SVG
    // ============================
    function barLabel(cx, cy, v){
      const t = el("text", { x: cx, y: Math.max(14, cy), "text-anchor":"middle", class:"axis" });
      t.textContent = fmt(v);
      return t;
    }

    function rectWithTooltip(x,y,w,h,cls,row,label,val){
      const r = el("rect", { x, y, width:w, height: Math.max(0,h), rx:10, class:cls, tabindex:0 });

      const sem = row.semestre === "1S" ? "1º semestre" : "2º semestre";
      const plannedTxt = (row.planned === null || row.planned === undefined) ? "N/A" : fmt(row.planned);

      const show = (clientX, clientY) => {
        tooltip.style.left = clientX + "px";
        tooltip.style.top = clientY + "px";
        tooltip.style.opacity = "1";
        tooltip.innerHTML = `
          <div class="t-title">${sem}</div>
          <div class="t-row"><span>${label}</span><b>${fmt(val)}</b></div>
          <div class="t-row"><span>Planejado</span><b>${plannedTxt}</b></div>
          <div class="t-row"><span>Executado</span><b>${fmt(row.executed ?? 0)}</b></div>
        `;
      };

      r.addEventListener("mousemove", (e)=>show(e.clientX, e.clientY));
      r.addEventListener("mouseleave", ()=>tooltip.style.opacity="0");
      r.addEventListener("focus", ()=>show(window.innerWidth/2, 120));
      r.addEventListener("blur", ()=>tooltip.style.opacity="0");

      return r;
    }

    function donutSlice(cx, cy, R, r, startAngle, endAngle){
      const large = (endAngle - startAngle) > 180 ? 1 : 0;
      const p1 = polar(cx, cy, R, endAngle);
      const p2 = polar(cx, cy, R, startAngle);
      const p3 = polar(cx, cy, r, startAngle);
      const p4 = polar(cx, cy, r, endAngle);

      const d = [
        `M ${p2.x} ${p2.y}`,
        `A ${R} ${R} 0 ${large} 1 ${p1.x} ${p1.y}`,
        `L ${p4.x} ${p4.y}`,
        `A ${r} ${r} 0 ${large} 0 ${p3.x} ${p3.y}`,
        "Z"
      ].join(" ");
      return el("path", { d });
    }

    function polar(cx, cy, r, angleDeg){
      const a = (angleDeg * Math.PI) / 180;
      return { x: cx + (r * Math.cos(a)), y: cy + (r * Math.sin(a)) };
    }

    function el(tag, attrs){
      const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
      Object.entries(attrs).forEach(([k,v])=> n.setAttribute(k, String(v)));
      return n;
    }

    // ===== sanity log =====
    console.log("Itens parseados:", DATA.length);
  </script>
