<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Relatório Semestral — GDA</title>
  <style>
    :root{
      --bg:#ffffff;
      --text:#0f172a;
      --muted:#475569;
      --border:#e2e8f0;
      --panel:#f8fafc;
      --shadow: 0 10px 30px rgba(2,6,23,.08);
      --r:16px;

      --planned:#1d4ed8;
      --executed:#16a34a;
      --grid:#e8eef7;

      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:var(--font);
      line-height:1.35;
    }

    .wrap{
      max-width: 1240px;
      margin: 28px auto;
      padding: 0 18px 34px;
    }

    header{
      display:flex;
      justify-content:space-between;
      gap:14px;
      align-items:flex-end;
      flex-wrap:wrap;
      margin-bottom: 14px;
    }

    h1{
      margin:0;
      font-size: 22px;
      letter-spacing:-0.02em;
    }
    .sub{
      margin:6px 0 0;
      color:var(--muted);
      font-size: 14px;
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .ctl{
      border:1px solid var(--border);
      border-radius: 12px;
      background:#fff;
      box-shadow: 0 1px 0 rgba(2,6,23,.02);
      padding: 10px 12px;
      display:flex;
      align-items:center;
      gap:8px;
      min-height: 44px;
    }
    .ctl label{
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    select{
      border:none;
      outline:none;
      font: inherit;
      font-size: 14px;
      color: var(--text);
      background: transparent;
      cursor:pointer;
      max-width: 520px;
    }

    .card{
      border:1px solid var(--border);
      border-radius: var(--r);
      background:#fff;
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .card-h{
      padding: 16px 16px 0;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .card-h h2{
      margin:0;
      font-size: 15px;
      letter-spacing:-0.01em;
    }
    .card-h p{
      margin:6px 0 0;
      color: var(--muted);
      font-size: 13px;
      max-width: 980px;
    }

    .pillrow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin: 10px 0 0;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      border:1px solid var(--border);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 13px;
      color: var(--muted);
      background:#fff;
      white-space: nowrap;
    }
    .dot{
      width:10px; height:10px; border-radius:999px;
      background: var(--planned);
      box-shadow: 0 0 0 3px rgba(29,78,216,.12);
    }
    .dot.exec{
      background: var(--executed);
      box-shadow: 0 0 0 3px rgba(22,163,74,.12);
    }

    .content{
      padding: 12px 16px 16px;
    }

    /* Table ABOVE the chart */
    .table-wrap{
      border:1px solid var(--border);
      border-radius: 14px;
      overflow:hidden;
      margin-bottom: 12px;
    }
    table{
      width:100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td{
      padding: 12px 12px;
      border-top: 1px solid var(--border);
      text-align:left;
      vertical-align: middle;
    }
    thead th{
      background: var(--panel);
      color: var(--muted);
      font-weight: 700;
      border-top:none;
      font-size: 13px;
      letter-spacing: .01em;
    }
    tbody tr:hover td{ background:#fbfdff; }
    .mono{ font-variant-numeric: tabular-nums; }

    /* Chart */
    .chart-wrap{
      border:1px solid var(--border);
      border-radius: 14px;
      background: linear-gradient(180deg, #fff, var(--panel));
      padding: 12px;
    }
    .legend{
      display:flex;
      justify-content:space-between;
      gap: 12px;
      flex-wrap:wrap;
      align-items:center;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .legend-left{
      display:flex;
      gap: 14px;
      flex-wrap:wrap;
      align-items:center;
    }
    .key{
      display:flex;
      align-items:center;
      gap:8px;
    }
    .sw{
      width:16px;
      height:10px;
      border-radius: 4px;
      background: var(--planned);
    }
    .sw.exec{ background: var(--executed); }

    svg{ width:100%; height:auto; display:block; }
    .gridline{ stroke: var(--grid); stroke-width: 1; }
    .axis text{ fill: var(--muted); font-size: 12px; }
    .barPlanned{ fill: var(--planned); }
    .barExecuted{ fill: var(--executed); }
    .label{ fill: var(--muted); font-size: 12px; }

    /* Tooltip */
    .tooltip{
      position: fixed;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, calc(-100% - 12px));
      background: #0b1220;
      color: #fff;
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 13px;
      box-shadow: 0 16px 40px rgba(0,0,0,.25);
      min-width: 260px;
      transition: opacity .12s ease;
      z-index: 50;
    }
    .tooltip .t-title{ font-weight: 800; margin-bottom: 7px; }
    .tooltip .t-row{ display:flex; justify-content:space-between; gap:12px; opacity:.96; }
    .tooltip .t-row b{ font-weight: 800; }

    .footnote{
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Relatório Anual — Planejado x Executado</h1>
      </div>

      <div class="controls">
        <div class="ctl">
          <label for="dept">Gerência</label>
          <select id="dept"></select>
        </div>
        <div class="ctl">
          <label for="group">Programa / Grupo</label>
          <select id="group"></select>
        </div>
        <div class="ctl">
          <label for="indicator">Indicador</label>
          <select id="indicator"></select>
        </div>
      </div>
    </header>

    <section class="card">
      <div class="card-h">
        <div>
          <h2 id="title">—</h2>
          <p id="desc">Tabela e gráfico com valor anual. Passe o mouse nas barras para detalhes.</p>
          <div class="pillrow">
            <span class="pill"><span class="dot"></span> Planejado</span>
            <span class="pill"><span class="dot exec"></span> Executado</span>
            <span class="pill" id="kpiInfo">Cumprimento: —</span>
          </div>
        </div>
      </div>

      <div class="content">
        <div class="table-wrap">
          <table aria-label="Tabela semestral">
            <thead>
              <tr>
                <th>Semestre</th>
                <th class="mono">Planejado</th>
                <th class="mono">Executado</th>
                <th class="mono">Cumprimento</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>

        <div class="chart-wrap">
          <div class="legend">
            <div class="legend-left">
              <div class="key"><span class="sw"></span> Planejado</div>
              <div class="key"><span class="sw exec"></span> Executado</div>
            </div>
            <div id="unitLabel" class="mono"></div>
          </div>

          <svg id="chart" viewBox="0 0 980 360" role="img" aria-label="Gráfico de barras por semestre"></svg>
          <div class="footnote" id="foot"></div>
        </div>
      </div>
    </section>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <!-- IMPORTANT: load your mock first -->
  <script src="./data.js"></script>

  <script>
    // Expecting: const MOCK_DATA = [...]
    if (typeof MOCK_DATA === "undefined") {
      document.body.innerHTML = "<pre style='padding:20px'>Erro: MOCK_DATA não encontrado. Verifique se ./data.js exporta: const MOCK_DATA = [...]</pre>";
      throw new Error("MOCK_DATA not found. Ensure data.js defines const MOCK_DATA = [...]");
    }

    const $ = (s) => document.querySelector(s);
    const deptSel = $("#dept");
    const groupSel = $("#group");
    const indSel = $("#indicator");
    const tbody = $("#tbody");
    const svg = $("#chart");
    const tip = $("#tooltip");

    function formatBR(n){
      const isInt = Math.abs(n - Math.round(n)) < 1e-9;
      return new Intl.NumberFormat("pt-BR", {
        maximumFractionDigits: isInt ? 0 : 2,
        minimumFractionDigits: isInt ? 0 : 2
      }).format(n);
    }

    function pct(exec, plan){
      if (!plan || plan === 0) return null;
      return (exec / plan) * 100;
    }

    // Populate selects
    const depts = [...new Set(MOCK_DATA.map(d => d.dept))].sort((a,b)=>a.localeCompare(b));
    depts.forEach(d => addOpt(deptSel, d, d));

    deptSel.addEventListener("change", () => {
      fillGroups(deptSel.value);
      fillIndicators(deptSel.value, groupSel.value);
      render(deptSel.value, groupSel.value, indSel.value);
    });

    groupSel.addEventListener("change", () => {
      fillIndicators(deptSel.value, groupSel.value);
      render(deptSel.value, groupSel.value, indSel.value);
    });

    indSel.addEventListener("change", () => {
      render(deptSel.value, groupSel.value, indSel.value);
    });

    // Init
    fillGroups(depts[0]);
    fillIndicators(depts[0], groupSel.value);
    render(depts[0], groupSel.value, indSel.value);

    function addOpt(sel, value, text){
      const o = document.createElement("option");
      o.value = value;
      o.textContent = text;
      sel.appendChild(o);
    }

    function fillGroups(dept){
      groupSel.innerHTML = "";
      const groups = [...new Set(MOCK_DATA.filter(d=>d.dept===dept).map(d=>d.group))].sort((a,b)=>a.localeCompare(b));
      groups.forEach(g => addOpt(groupSel, g, g));
    }

    function fillIndicators(dept, group){
      indSel.innerHTML = "";
      const inds = [...new Set(MOCK_DATA.filter(d=>d.dept===dept && d.group===group).map(d=>d.indicator))]
        .sort((a,b)=>a.localeCompare(b));
      inds.forEach(i => addOpt(indSel, i, i));
    }

    function render(dept, group, indicator){
      const item = MOCK_DATA.find(d => d.dept===dept && d.group===group && d.indicator===indicator);
      if (!item) return;

      $("#title").textContent = `${dept} — ${group} — ${indicator}`;
      $("#unitLabel").textContent = item.unit ? `Unidade: ${item.unit}` : "";

      const pAll = pct(item.s1.executed + item.s2.executed, item.s1.planned + item.s2.planned);
      $("#kpiInfo").textContent = `Cumprimento (ano): ${pAll === null ? "—" : pAll.toFixed(1) + "%"}`;

      // Table
      tbody.innerHTML = "";
      const rows = [
        { sem:"1º semestre", s:item.s1 },
        { sem:"2º semestre", s:item.s2 },
      ];
      rows.forEach(r => {
        const plan = r.s.planned;
        const exec = r.s.executed;
        const pc = pct(exec, plan);
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${r.sem}</td>
          <td class="mono">${formatBR(plan)}</td>
          <td class="mono">${formatBR(exec)}</td>
          <td class="mono">${pc === null ? "—" : pc.toFixed(1) + "%"}</td>
        `;
        tbody.appendChild(tr);
      });

      $("#foot").textContent = "Fonte: data.js (MOCK_DATA).";

      drawChart(item);
    }

    function drawChart(item){
      const W = 980, H = 360;
      const pad = { top: 18, right: 18, bottom: 60, left: 78 };
      const innerW = W - pad.left - pad.right;
      const innerH = H - pad.top - pad.bottom;

      const data = [
        { label:"1º semestre", planned:item.s1.planned, executed:item.s1.executed },
        { label:"2º semestre", planned:item.s2.planned, executed:item.s2.executed },
      ];

      const maxV = Math.max(1, ...data.flatMap(d => [d.planned, d.executed]));
      const yMax = Math.ceil(maxV * 1.12);

      const y = (v) => pad.top + (1 - (v / yMax)) * innerH;
      const hh = (v) => (v / yMax) * innerH;

      const groupW = innerW / 2;
      const barGap = 16;
      const barW = Math.min(170, (groupW - 2*barGap) / 2);
      const gx = (i) => pad.left + i*groupW + (groupW - (2*barW + barGap))/2;

      const ticks = 5;
      const tickVals = Array.from({length: ticks+1}, (_,k) => (k*yMax)/ticks);

      svg.innerHTML = "";

      // gridlines + y labels
      tickVals.forEach(tv => {
        const yy = y(tv);
        svg.appendChild(el("line", { x1: pad.left, y1: yy, x2: W-pad.right, y2: yy, class:"gridline" }));
        const t = el("text", { x: pad.left-10, y: yy+4, "text-anchor":"end", class:"axis" });
        t.textContent = formatBR(tv);
        svg.appendChild(t);
      });

      // x labels
      data.forEach((d,i) => {
        const cx = gx(i) + (2*barW + barGap)/2;
        const tx = el("text", { x: cx, y: H-26, "text-anchor":"middle", class:"axis" });
        tx.textContent = d.label;
        svg.appendChild(tx);
      });

      // bars + labels + tooltip
      data.forEach((d,i) => {
        const x0 = gx(i);

        const pRect = rectWithTip(x0, y(d.planned), barW, hh(d.planned), "barPlanned", d, item, "Planejado", d.planned);
        svg.appendChild(pRect);
        svg.appendChild(valueLabel(x0 + barW/2, y(d.planned)-7, d.planned));

        const ex = x0 + barW + barGap;
        const eRect = rectWithTip(ex, y(d.executed), barW, hh(d.executed), "barExecuted", d, item, "Executado", d.executed);
        svg.appendChild(eRect);
        svg.appendChild(valueLabel(ex + barW/2, y(d.executed)-7, d.executed));
      });
    }

    function valueLabel(x, y, v){
      const t = el("text", { x, y: Math.max(14, y), "text-anchor":"middle", class:"label" });
      t.textContent = formatBR(v);
      return t;
    }

    function rectWithTip(x,y,w,h,cls,semRow,item,kind,value){
      const r = el("rect", { x, y, width:w, height: Math.max(0,h), rx: 10, class: cls, tabindex: 0 });

      const plannedTxt = formatBR(semRow.planned);
      const executedTxt = formatBR(semRow.executed);
      const unitTxt = item.unit ? ` ${item.unit}` : "";
      const pc = (semRow.planned && semRow.planned !== 0) ? (semRow.executed/semRow.planned*100) : null;

      const show = (clientX, clientY) => {
        tip.style.left = clientX + "px";
        tip.style.top = clientY + "px";
        tip.style.opacity = "1";
        tip.innerHTML = `
          <div class="t-title">${semRow.label}</div>
          <div class="t-row"><span>Gerência</span><b>${item.dept}</b></div>
          <div class="t-row"><span>Grupo</span><b>${item.group}</b></div>
          <div class="t-row"><span>Indicador</span><b>${item.indicator}</b></div>
          <div class="t-row"><span>Planejado</span><b>${plannedTxt}${unitTxt}</b></div>
          <div class="t-row"><span>Executado</span><b>${executedTxt}${unitTxt}</b></div>
          <div class="t-row"><span>Cumprimento</span><b>${pc===null ? "—" : pc.toFixed(1) + "%"}</b></div>
        `;
      };

      r.addEventListener("mousemove", (e)=>show(e.clientX, e.clientY));
      r.addEventListener("mouseleave", ()=> tip.style.opacity="0");
      r.addEventListener("focus", ()=> show(window.innerWidth/2, 130));
      r.addEventListener("blur", ()=> tip.style.opacity="0");

      return r;
    }

    function el(tag, attrs){
      const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
      Object.entries(attrs).forEach(([k,v]) => n.setAttribute(k, String(v)));
      return n;
    }
  </script>
</body>
</html>
